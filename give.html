<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff4d80">
  <title>Happy Birthday!</title>
  <style>
    :root { --pink:#ff4d80; --violet:#7149db; --ink:#39142d; }
    * { box-sizing:border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #fff9c8 0, #ffd4e1 39%, #dcc9ff 100%);
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .card {
      width: min(91vw, 520px);
      padding: clamp(28px, 7vw, 52px) clamp(22px, 7vw, 48px);
      text-align: center;
      background: rgba(255,255,255,.78);
      border: 2px solid rgba(255,255,255,.95);
      border-radius: 32px;
      box-shadow: 0 22px 55px rgba(99,41,90,.25);
      backdrop-filter: blur(8px);
    }

    .balloons {
      font-size: clamp(3.5rem, 14vw, 5.5rem);
      letter-spacing: .05em;
      animation: float 2.8s ease-in-out infinite;
    }

    h1 {
      margin: 12px 0;
      color: var(--pink);
      font-size: clamp(2.5rem, 11vw, 4.4rem);
      line-height: .95;
      letter-spacing: -.07em;
    }

    p {
      margin: 0 auto 25px;
      max-width: 31ch;
      font-size: clamp(1rem, 4.5vw, 1.2rem);
      line-height: 1.55;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 14px 24px;
      color: white;
      background: linear-gradient(135deg, var(--pink), #ff7d55);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(218,51,104,.35);
    }

    button:active {
      transform: translateY(2px);
    }

    .hint {
      display: block;
      margin-top: 17px;
      font-size: .8rem;
      opacity: .66;
    }

    @keyframes float {
      50% { transform: translateY(-12px) rotate(3deg); }
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <main class="card">
    <div class="balloons">🎈🎉🎈</div>

    <!-- Change “Birthday Star” to the person's name -->
    <h1>Happy Birthday,<br>Birthday Star!</h1>

    <p>
      Wishing you a day filled with laughter, love, cake,
      and every little thing that makes you smile.
    </p>

    <button id="celebrate">Celebrate! 🎊</button>
    <span class="hint">Tap the button for more confetti</span>
  </main>

  <script>
    const canvas = document.querySelector("#confetti");
    const ctx = canvas.getContext("2d");

    const colors = ["#ff4d80", "#7149db", "#ffc93c", "#22c7b8", "#ff8a4c"];
    let pieces = [];

    function resize() {
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }

    addEventListener("resize", resize);
    resize();

    function shower(amount = 140) {
      for (let i = 0; i < amount; i++) {
        pieces.push({
          x: innerWidth / 2 + (Math.random() - 0.5) * 120,
          y: innerHeight * 0.4 + (Math.random() - 0.5) * 50,
          vx: (Math.random() - 0.5) * 10,
          vy: -2 - Math.random() * 10,
          size: 4 + Math.random() * 6,
          color: colors[i % colors.length],
          spin: (Math.random() - 0.5) * 0.25,
          angle: Math.random() * 6.28,
          life: 1
        });
      }
    }

    function animate() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      pieces = pieces.filter(piece => piece.life > 0.02);

      pieces.forEach(piece => {
        piece.x += piece.vx;
        piece.y += piece.vy;
        piece.vy += 0.18;
        piece.angle += piece.spin;
        piece.life *= 0.986;

        ctx.save();
        ctx.globalAlpha = piece.life;
        ctx.translate(piece.x, piece.y);
        ctx.rotate(piece.angle);
        ctx.fillStyle = piece.color;
        ctx.fillRect(
          -piece.size / 2,
          -piece.size / 2,
          piece.size,
          piece.size * 1.7
        );
        ctx.restore();
      });

      requestAnimationFrame(animate);
    }

    document.querySelector("#celebrate").addEventListener("click", () => {
      shower(180);
    });

    shower();
    animate();
  </script>
</body>
</html>
